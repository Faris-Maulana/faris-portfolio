# Gerbang wajib: persis `npm run verify` lokal. Tanpa secret, token read-only, actions dipin per SHA.
# Uji yang butuh kredensial/jaringan internal TIDAK di sini: taruh di `verify:live`, jalankan lokal.
name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Vercel tidak dipin di repo ini; 22 = LTS tertua yang masih dijalankan Vercel (batas bawah konservatif).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify
